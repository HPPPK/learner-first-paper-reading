<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">Learner-first paper reading workflow</title>
  <desc id="flow-desc">Five stages connect the inspected source to prerequisite scaffolding, original reading, learner teach-back, and an evidence boundary check.</desc>
  <rect width="1200" height="260" rx="24" fill="#07111F"/>
  <path d="M160 130 H1040" stroke="#42D3C5" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <g transform="translate(140 130)">
      <circle r="48" fill="#10243B" stroke="#42D3C5" stroke-width="3"/><text y="7" fill="#F4F8FC" font-size="25" font-weight="750">01</text>
      <text y="82" fill="#B9CBDD" font-size="17" font-weight="650">SOURCE</text>
    </g>
    <g transform="translate(370 130)">
      <circle r="48" fill="#10243B" stroke="#42D3C5" stroke-width="3"/><text y="7" fill="#F4F8FC" font-size="25" font-weight="750">02</text>
      <text y="82" fill="#B9CBDD" font-size="17" font-weight="650">SCAFFOLD</text>
    </g>
    <g transform="translate(600 130)">
      <circle r="52" fill="#152941" stroke="#F3B562" stroke-width="4"/><text y="7" fill="#F3B562" font-size="25" font-weight="800">03</text>
      <text y="86" fill="#F3C98D" font-size="17" font-weight="750">YOU READ</text>
    </g>
    <g transform="translate(830 130)">
      <circle r="48" fill="#10243B" stroke="#42D3C5" stroke-width="3"/><text y="7" fill="#F4F8FC" font-size="25" font-weight="750">04</text>
      <text y="82" fill="#B9CBDD" font-size="17" font-weight="650">TEACH BACK</text>
    </g>
    <g transform="translate(1060 130)">
      <circle r="48" fill="#10243B" stroke="#42D3C5" stroke-width="3"/><text y="7" fill="#F4F8FC" font-size="25" font-weight="750">05</text>
      <text y="82" fill="#B9CBDD" font-size="17" font-weight="650">EVIDENCE</text>
    </g>
  </g>
</svg>
