<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Learner-First Paper Reading</title>
  <desc id="hero-desc">A research reading path from source through learner explanation to evidence, with the tagline AI scaffolds. You read. Evidence decides.</desc>
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="1" stop-color="#10243B"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#hero-bg)"/>
  <circle cx="1040" cy="74" r="140" fill="#42D3C5" opacity="0.06"/>
  <circle cx="1070" cy="350" r="190" fill="#F3B562" opacity="0.05"/>
  <g transform="translate(86 87)">
    <path d="M0 16 Q64 -8 128 16 V174 Q64 150 0 174 Z" fill="none" stroke="#42D3C5" stroke-width="4"/>
    <path d="M128 16 Q192 -8 256 16 V174 Q192 150 128 174 Z" fill="none" stroke="#42D3C5" stroke-width="4"/>
    <path d="M128 18 V174" stroke="#42D3C5" stroke-width="3"/>
    <circle cx="128" cy="96" r="15" fill="#F3B562" filter="url(#glow)"/>
    <path d="M42 52 H92 M42 80 H102 M164 52 H214 M154 80 H214" stroke="#DCE9F5" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="400" y="130" fill="#42D3C5" font-size="18" font-weight="700" letter-spacing="3">AGENT SKILL · RESEARCH LEARNING</text>
    <text x="400" y="194" fill="#F4F8FC" font-size="48" font-weight="760">Learner-First</text>
    <text x="400" y="250" fill="#F4F8FC" font-size="48" font-weight="760">Paper Reading</text>
    <text x="402" y="307" fill="#B9CBDD" font-size="24">AI scaffolds. <tspan fill="#F3B562">You read.</tspan> Evidence decides.</text>
  </g>
  <g transform="translate(402 340)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="650">
    <rect width="98" height="34" rx="17" fill="#42D3C5" opacity="0.16"/><text x="20" y="22" fill="#80E5DC">PAPER</text>
    <rect x="110" width="126" height="34" rx="17" fill="#42D3C5" opacity="0.12"/><text x="129" y="22" fill="#B7D9E9">BACKGROUND</text>
    <rect x="248" width="108" height="34" rx="17" fill="#42D3C5" opacity="0.12"/><text x="268" y="22" fill="#B7D9E9">ANALYST</text>
    <rect x="368" width="108" height="34" rx="17" fill="#F3B562" opacity="0.13"/><text x="388" y="22" fill="#F3C98D">UNKNOWN</text>
  </g>
</svg>
